<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sagar & Dhrupti · Wedding Invitation · 2 February 2027</title>
<meta name="description" content="With the blessings of our families, join Sagar and Dhrupti for their wedding on 2 February 2027 at Arya Samaj, Goregaon West, Mumbai.">
<meta name="theme-color" content="#3b0918">
<meta property="og:title" content="Sagar & Dhrupti · Wedding Invitation">
<meta property="og:description" content="2 February 2027 · Arya Samaj, Goregaon West, Mumbai">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b3122e'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23f2b705' font-family='serif'%3ES%26D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Spectral:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Gujarati:wght@400;600;800&family=Noto+Serif+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<style>
:root{
  --sindoor:#b3122e; --sindoor-deep:#7d0a20; --haldi:#f2b705; --haldi-soft:#ffd75e;
  --night:#3b0918; --paan:#1f6b4f; --gulabi:#fce6e3; --gulabi-2:#f8d3cf; --ink:#2a0610;
  --display:'Rozha One','Noto Serif Devanagari',serif;
  --body:'Spectral','Noto Serif Gujarati','Noto Serif Devanagari',serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --dots:radial-gradient(circle,var(--haldi) 1.4px,transparent 1.9px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;font:400 1.125rem/1.75 var(--body);color:var(--ink);background:var(--gulabi);overflow-x:clip;min-width:320px}
body[data-l=gu]{font-family:'Noto Serif Gujarati','Spectral',serif;font-size:1.0625rem}
body[data-l=hi],body[data-l=mr]{font-family:'Noto Serif Devanagari','Spectral',serif;font-size:1.0625rem}
body.locked{overflow:hidden}
img,svg,iframe,canvas{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--haldi);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───────── Gate: the sealed kankotri ───────── */
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;perspective:1600px;background:var(--night)}
#gate[hidden]{display:none}
.door{position:absolute;top:0;bottom:0;width:50.5%;background:
   var(--dots) 0 0/16px 16px, var(--dots) 8px 8px/16px 16px,
   linear-gradient(160deg,var(--sindoor),var(--sindoor-deep));
  transition:transform 1.6s var(--ease);box-shadow:inset 0 0 0 10px var(--sindoor-deep),inset 0 0 0 12px var(--haldi);will-change:transform}
.door.l{left:0;transform-origin:left center}
.door.r{right:0;transform-origin:right center}
.door::after{content:"";position:absolute;inset:12% 16%;border:2px solid var(--haldi);border-radius:50% 50% 6px 6px/26% 26% 6px 6px;opacity:.75}
#gate.open .door.l{transform:rotateY(-105deg)}
#gate.open .door.r{transform:rotateY(105deg)}
#gate.open{background:transparent;pointer-events:none;transition:background 1.2s .2s}
.seal{position:relative;z-index:2;border:0;cursor:pointer;width:clamp(150px,42vw,200px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe48a,var(--haldi) 45%,#c78e00);color:var(--sindoor-deep);
  box-shadow:0 0 0 6px var(--sindoor-deep),0 0 0 8px var(--haldi),0 18px 50px #0008;display:grid;place-content:center;gap:.2rem;text-align:center;
  transition:transform .8s var(--ease),opacity .6s}
.seal b{font:400 clamp(2.4rem,11vw,3.2rem)/1 var(--display)}
.seal span{font-size:.9rem;line-height:1.3;padding:0 1.2rem}
.seal:hover{transform:scale(1.04)}
#gate.open .seal{transform:scale(.6);opacity:0}
.gate-to{position:absolute;bottom:max(2rem,env(safe-area-inset-bottom));left:0;right:0;z-index:2;text-align:center;color:var(--haldi-soft);font-size:1.05rem;padding:0 1rem}
#gate.open .gate-to{opacity:0;transition:opacity .4s}

/* ───────── Language switch ───────── */
.lang{position:fixed;top:max(.75rem,env(safe-area-inset-top));right:.75rem;z-index:60;display:flex;gap:2px;padding:3px;border-radius:999px;background:#3b0918d9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px #0004}
.lang button{border:0;background:none;color:var(--haldi-soft);min-width:40px;height:34px;padding:0 .6rem;border-radius:999px;cursor:pointer;font-size:.95rem}
.lang button[aria-pressed=true]{background:var(--haldi);color:var(--night);font-weight:600}

/* ───────── Hero: looking through a jharokha ───────── */
#hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:radial-gradient(120% 80% at 50% 38%,#e3342f 0%,var(--sindoor) 38%,var(--sindoor-deep) 75%,var(--night) 100%);color:#fff6dc}
.layer{position:absolute;will-change:transform;pointer-events:none}
.sun{left:50%;top:40%;width:min(70vw,460px);aspect-ratio:1;margin:calc(min(70vw,460px)/-2) 0 0 calc(min(70vw,460px)/-2);border-radius:50%;
  background:radial-gradient(circle,#ffe9a0 0%,var(--haldi) 42%,#f2b70500 70%);opacity:.55}
.mandala{left:50%;top:40%;width:min(118vw,860px);aspect-ratio:1;margin:calc(min(118vw,860px)/-2) 0 0 calc(min(118vw,860px)/-2);color:var(--haldi);opacity:.32}
.mandala svg{width:100%;height:100%;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toran{top:0;left:-5%;right:-5%;height:110px;z-index:6}
.toran svg{width:100%;height:100%}
.toran .sw{transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
#petals{position:absolute;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
.arch{inset:0;z-index:5;display:flex;justify-content:center;align-items:flex-end;transform-origin:50% 60%}
.arch svg{height:min(100%,172vw);width:auto;aspect-ratio:2/3;flex:none;max-width:none;overflow:visible}
.hero-copy{position:absolute;z-index:7;left:50%;top:57%;transform:translate(-50%,-50%);width:min(88vw,560px);text-align:center;will-change:transform,opacity}
.hero-copy>*{opacity:0;transform:translateY(18px)}
body.opened .hero-copy>*{animation:rise 1.1s var(--ease) forwards}
body.opened .hero-copy>*:nth-child(2){animation-delay:.15s}
body.opened .hero-copy>*:nth-child(3){animation-delay:.3s}
body.opened .hero-copy>*:nth-child(4){animation-delay:.55s}
body.opened .hero-copy>*:nth-child(5){animation-delay:.8s}
body.opened .hero-copy>*:nth-child(6){animation-delay:1s}
@keyframes rise{to{opacity:1;transform:none}}
.bless{font-size:.95rem;color:var(--haldi-soft);letter-spacing:.02em;margin:0 0 .6rem}
.side-tag{display:inline-block;margin:0 0 1rem;padding:.15rem .9rem;border:1px solid #ffd75e88;border-radius:999px;font-size:.88rem;color:#ffe9b0}
.dear{margin:0 0 .2rem;font-size:1.15rem;color:#fff}
.invite-line{margin:0 auto .4rem;max-width:30ch;font-size:1.02rem;line-height:1.55;color:#ffe9c9}
.names{margin:.2rem 0 .3rem;font:400 clamp(3rem,15vw,6.6rem)/1.02 var(--display);color:var(--haldi);text-shadow:0 3px 0 var(--sindoor-deep),0 10px 40px #0007}
.names .n{display:block}
.names .amp{display:block;font-size:.42em;line-height:1.3;color:#fff6dc;text-shadow:none}
.when{margin:.6rem 0 0;font-size:1.1rem;color:#fff}
.scroll-cue{position:absolute;z-index:8;left:50%;bottom:max(1.1rem,env(safe-area-inset-bottom));transform:translateX(-50%);width:28px;height:44px;border:2px solid #ffd75eaa;border-radius:16px}
.scroll-cue::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--haldi);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{60%{transform:translateY(14px);opacity:0}}

/* ───────── Paper sections ───────── */
main{position:relative;z-index:2}
.page{position:relative;padding:clamp(4rem,10vw,7rem) 1.25rem}
.inner{max-width:680px;margin:0 auto;position:relative;z-index:2}
.wide{max-width:1000px}
.border-band{height:28px;background:var(--dots) 0 0/14px 14px,var(--dots) 7px 7px/14px 14px,var(--sindoor);border-block:3px solid var(--haldi)}
h2{font:400 clamp(2rem,6.4vw,3.1rem)/1.15 var(--display);color:var(--sindoor);text-align:center;margin:0 0 .6rem}
body[data-l=gu] h2{font-family:'Noto Serif Gujarati',serif;font-weight:800}
.lede{text-align:center;max-width:46ch;margin:0 auto 2.6rem;color:#5a2330}
.motif{display:block;width:120px;height:24px;margin:0 auto 1rem;color:var(--sindoor)}

/* couple */
.couple{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(.8rem,3vw,2rem)}
.person{text-align:center}
.medal{width:clamp(110px,30vw,190px);aspect-ratio:1;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;
  background:var(--dots) 0 0/12px 12px,var(--dots) 6px 6px/12px 12px,var(--sindoor);box-shadow:0 0 0 4px var(--gulabi),0 0 0 6px var(--haldi),0 14px 34px #7d0a2040;overflow:hidden}
.medal img{width:100%;height:100%;object-fit:cover}
.medal b{font:400 clamp(2.6rem,9vw,4.4rem)/1 var(--display);color:var(--haldi)}
.person h3{margin:0;font:400 clamp(1.5rem,5vw,2.2rem)/1.2 var(--display);color:var(--night)}
.person p{margin:.2rem 0 0;color:#6b3340;font-size:.98rem}
.knot{width:clamp(36px,8vw,60px);color:var(--haldi)}

/* countdown */
#countdown{background:var(--night);color:#fff3d4;overflow:hidden}
#countdown h2{color:var(--haldi)}
#countdown .bgm{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;color:var(--haldi);opacity:.08}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(.5rem,2vw,1rem);max-width:560px;margin:2rem auto 0}
.cd div{text-align:center;padding:1rem .2rem .8rem;border:1.5px solid #f2b70566;border-radius:999px 999px 14px 14px;background:#ffffff08}
.cd b{display:block;font:400 clamp(2rem,8vw,3.2rem)/1.05 var(--display);color:var(--haldi);font-variant-numeric:tabular-nums}
.cd span{font-size:.85rem;color:#ffe2b8}
.cal{display:flex;justify-content:center;margin-top:2rem}

/* events timeline */
.timeline{position:relative;margin:0;padding:0;list-style:none}
.timeline::before{content:"";position:absolute;left:22px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--haldi),var(--sindoor));transform-origin:top;transform:scaleY(var(--line,0));transition:transform 1.4s var(--ease)}
.timeline li{position:relative;padding:0 0 2.4rem 64px}
.timeline li:last-child{padding-bottom:0}
.timeline .dot{position:absolute;left:8px;top:4px;width:30px;height:30px;border-radius:50%;background:var(--haldi);box-shadow:0 0 0 4px var(--gulabi),0 0 0 6px var(--sindoor);display:grid;place-items:center;color:var(--sindoor-deep)}
.timeline .dot svg{width:16px;height:16px}
.timeline h3{margin:0;font:400 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--display);color:var(--sindoor-deep)}
body[data-l=gu] .timeline h3{font-family:'Noto Serif Gujarati',serif;font-weight:800}
.timeline time{display:block;margin:.15rem 0 .35rem;color:var(--paan);font-weight:600}
.timeline p{margin:0;color:#5a2330}
.timeline small{display:block;margin-top:.3rem;color:#7c4652}

/* venue */
#venue{background:linear-gradient(var(--gulabi-2),var(--gulabi))}
.venue{display:grid;gap:1.6rem;align-items:center}
.venue-card{text-align:center}
.venue-card h3{margin:0 0 .4rem;font:400 clamp(1.6rem,5vw,2.2rem)/1.2 var(--display);color:var(--night)}
.venue-card address{font-style:normal;color:#5a2330;max-width:40ch;margin:0 auto}
.map{position:relative;border-radius:200px 200px 18px 18px;overflow:hidden;aspect-ratio:4/3.4;box-shadow:0 0 0 4px var(--gulabi),0 0 0 6px var(--haldi),0 22px 50px #7d0a2033;background:var(--gulabi-2)}
.map iframe{width:100%;height:100%;border:0}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.4rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;padding:.65rem 1.5rem;border:0;border-radius:999px;cursor:pointer;
  background:var(--sindoor);color:#fff6dc;font-weight:600;text-decoration:none;box-shadow:0 6px 0 var(--sindoor-deep);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sindoor-deep)}
.btn.gold{background:var(--haldi);color:var(--night);box-shadow:0 6px 0 #a87b00}
.btn.gold:active{box-shadow:0 2px 0 #a87b00}
.btn.wa{background:#1f8f4e;box-shadow:0 6px 0 #11603a;color:#fff}
.btn.ghost{background:transparent;color:var(--sindoor-deep);box-shadow:inset 0 0 0 2px var(--sindoor)}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.6;cursor:progress}

/* gallery */
.gallery{columns:3 220px;column-gap:.9rem}
.gallery figure{margin:0 0 .9rem;break-inside:avoid;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px var(--haldi)}
.gallery img{width:100%;height:auto}

/* rsvp */
#rsvp{background:var(--gulabi)}
.card{position:relative;background:#fffaf6;border-radius:24px;padding:clamp(1.4rem,5vw,2.6rem);box-shadow:0 0 0 1px #f2b70555,0 30px 70px -30px #7d0a2055}
.card::before{content:"";position:absolute;inset:10px;border:1.5px dashed #b3122e44;border-radius:16px;pointer-events:none}
form{display:grid;gap:1.1rem;position:relative}
.two{display:grid;gap:1.1rem}
.field{display:grid;gap:.35rem}
.field>span,.legend{font-weight:600;font-size:.98rem;color:var(--night)}
input[type=text],input[type=tel],input[type=email],input[type=number],textarea{width:100%;min-height:50px;padding:.7rem .95rem;border:1.5px solid #e3b7ae;border-radius:12px;background:#fff;font-size:1rem}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{border-color:var(--sindoor);outline:none;box-shadow:0 0 0 3px #b3122e22}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:.45rem 1rem;border-radius:999px;border:1.5px solid #e3b7ae;background:#fff;font-size:.98rem;transition:background .2s,border-color .2s,color .2s}
.chip input:checked+span{background:var(--sindoor);border-color:var(--sindoor);color:#fff6dc}
.chip input:focus-visible+span{outline:3px solid var(--haldi);outline-offset:2px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid #e3b7ae;border-radius:999px;background:#fff;width:max-content}
.stepper button{width:48px;height:48px;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--sindoor)}
.stepper input{width:56px;min-height:46px;border:0;text-align:center;padding:0;font-weight:600;-moz-appearance:textfield;box-shadow:none!important}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.consent{display:flex;gap:.65rem;align-items:flex-start;font-size:.95rem;color:#5a2330}
.consent input{width:20px;height:20px;margin-top:.3rem;accent-color:var(--sindoor);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.submit-row{display:grid;gap:.6rem;justify-items:center;margin-top:.4rem}
.note{font-size:.88rem;color:#7c4652;text-align:center;margin:0}
#msg{min-height:1.5em;text-align:center;font-weight:600;margin:0}
#msg.err{color:var(--sindoor)}
.done{display:none;text-align:center;position:relative}
.done.show{display:block;animation:pop .6s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.done h3{font:400 clamp(1.7rem,5vw,2.3rem)/1.2 var(--display);color:var(--sindoor);margin:.4rem 0}
.done p{margin:0 auto 1.4rem;max-width:36ch;color:#5a2330}
.diya{width:70px;margin:0 auto;color:var(--haldi)}
.diya .flame{transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.9,1.08) rotate(2deg)}}

.custom .body p{margin:0 0 1rem;text-align:center}
.custom .body p:last-child{margin-bottom:0}
.custom figure{margin:0 auto 1.6rem;max-width:520px;border-radius:200px 200px 18px 18px;overflow:hidden;box-shadow:0 0 0 4px var(--gulabi),0 0 0 6px var(--haldi)}
.custom figure img{width:100%;height:auto}
.custom.quote{background:var(--night);color:#ffe2b8;text-align:center}
.custom.quote h2{color:var(--haldi);font-size:clamp(1.3rem,4vw,1.7rem)}
.custom.quote .body p{font-size:clamp(1.25rem,4vw,1.6rem);line-height:1.6;font-style:italic;color:#fff3d4}
.custom ul.names-list{list-style:none;margin:0 auto;padding:0;max-width:480px;display:grid;gap:.15rem}
.custom ul.names-list li{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px dashed #b3122e33}
.custom ul.names-list li b{font-weight:600;color:var(--night)}
.custom ul.names-list li span{color:#7c4652;text-align:right}
.custom ul.names-list li.solo{justify-content:center}

/* footer */
footer{background:var(--night);color:#ffe2b8;text-align:center;padding:3.5rem 1.25rem calc(6rem + env(safe-area-inset-bottom))}
footer .names-s{font:400 clamp(2rem,7vw,2.8rem)/1.2 var(--display);color:var(--haldi);margin:0 0 .4rem}
footer p{margin:.2rem 0}
footer small{display:block;margin-top:1.4rem;opacity:.7;font-size:.85rem}

/* floating whatsapp */
.fab{position:fixed;z-index:55;right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));display:flex;align-items:center;gap:.5rem;height:54px;padding:0 1.1rem 0 .9rem;border-radius:999px;background:#1f8f4e;color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;box-shadow:0 10px 30px #0b3d2266;transform:translateY(140%);transition:transform .5s var(--ease)}
.fab.show{transform:none}
.fab svg{width:26px;height:26px}

@media (min-width:760px){
  .two{grid-template-columns:1fr 1fr}
  .venue{grid-template-columns:1.05fr 1fr;gap:3rem}
  .venue-card{text-align:left}
  .venue-card address{margin:0}
  .venue .actions{justify-content:flex-start}
  .timeline::before{left:50%;margin-left:-1px}
  .timeline li{width:50%;padding:0 3rem 3rem 0;text-align:right}
  .timeline li:nth-child(even){margin-left:50%;padding:0 0 3rem 3rem;text-align:left}
  .timeline .dot{left:auto;right:-15px}
  .timeline li:nth-child(even) .dot{right:auto;left:-15px}
}
@media (max-width:420px){
  .fab .lbl{display:none}
  .fab{padding:0;width:56px;justify-content:center}
}
@media (max-width:330px){.couple{grid-template-columns:1fr}.knot{transform:rotate(90deg);margin:0 auto}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .hero-copy>*{opacity:1;transform:none}
  #petals{display:none}
}
</style>
</head>
<body data-l="gu" class="locked">

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="seal-label">
  <div class="door l" aria-hidden="true"></div><div class="door r" aria-hidden="true"></div>
  <button class="seal" id="seal" type="button"><b aria-hidden="true">S&amp;D</b><span id="seal-label"></span></button>
  <p class="gate-to" id="gate-to"></p>
</div>

<nav class="lang" aria-label="Language"></nav>

<header id="hero">
  <div class="layer sun" data-depth=".18"></div>
  <div class="layer mandala" data-depth=".3" id="mandala"></div>
  <canvas id="petals" aria-hidden="true"></canvas>
  <div class="layer toran" data-depth="-.06" aria-hidden="true"><svg viewBox="0 0 1200 120" preserveAspectRatio="none" id="toran"></svg></div>
  <div class="layer arch" id="arch" aria-hidden="true">
        <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
      <defs>

const hero = $('hero'), heroCopy = $('hero-copy'), arch = $('arch');
const layers = [...document.querySelectorAll('[data-depth]')];

function parallax() {

  if (y < vh * 1.2) {

    heroCopy.style.transform = `translate(-50%, calc(-50% + ${y * .35}px)) scale(${1 - p * .12})`;
    heroCopy.style.opacity = String(1 - p * 1.3);
  }
  for (const el of layers) {
    const box = el.parentElement.getBoundingClientRect();
    if (box.bottom < -100 || box.top > vh + 100) continue;
    el.style.transform = `translate3d(0, ${(-(box.top + box.height / 2 - vh / 2) * el.dataset.depth).toFixed(1)}px, 0)`;

      p.y += p.s; p.a += p.w; p.x += Math.sin(p.a) * .6;
      if (p.y > Hh + 20) { p.y = -20; p.x = Math.random() * W }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = .85;
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.28); ctx.fill(); ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ───────── Map (lazy) ───────── */
new IntersectionObserver((en, ob) => {
  if (!en[0].isIntersecting) return; ob.disconnect();
  const v = settings.venue || {};
  $('map').innerHTML = `<iframe title="${esc(v.name || 'Venue map')}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent((v.name || '') + ', ' + (v.address || ''))}&z=16&output=embed"></iframe>`;
}, { rootMargin: '300px' }).observe($('map'));

/* ───────── RSVP ───────── */
const form = $('f');
form.addEventListener('change', e => { if (e.target.name === 'attendance') syncAttendance() });
form.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => { const i = form.party_size; i.value = Math.min(20, Math.max(1, (Number(i.value) || 1) + Number(b.dataset.step))) }));

function waMessage(b) {
  const attTxt = { attending: T('yes'), not_attending: T('no'), maybe: T('maybe') }[b.attendance];
  const evNames = events.filter((e, i) => b.event_keys.includes(e.id || e.slug || String(i))).map(e => pick(e.title));
  const lines = [`🙏 ${T('wa_head')}`, '', `${T('wa_name')}: ${b.guest_name}`, `${T('wa_att')}: ${attTxt}`];
  if (b.attendance !== 'not_attending') { lines.push(`${T('wa_guests')}: ${b.party_size}`); if (evNames.length) lines.push(`${T('wa_events')}: ${evNames.join(', ')}`) }
  if (b.dietary_notes) lines.push(`${T('wa_food')}: ${b.dietary_notes}`);
  if (b.message) lines.push(`${T('wa_msg')}: ${b.message}`);
  if (b.phone) lines.push(`📞 ${b.phone}`);
  return lines.join('\n');
}
const timeout = (ms) => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal };

async function saveRsvp(b) {
  const uuids = b.event_keys.filter(k => /^[0-9a-f-]{36}$/i.test(k));
  const args = { p_guest_name: b.guest_name, p_phone: b.phone, p_email: b.email, p_attendance: b.attendance, p_party_size: b.party_size, p_event_ids: uuids, p_dietary_notes: b.dietary_notes, p_message: b.message, p_preferred_language: L, p_whatsapp_consent: b.whatsapp_consent, p_ref_code: ref, p_invite_code: inviteCode };
  const r = await fetch(API + '/rest/v1/rpc/submit_rsvp_v2', { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify(args), signal: timeout(12000) });
  if (r.ok) return true;
  if (r.status !== 404) throw new Error('rpc ' + r.status);
  /* Migration not applied yet: fall back to the original submit-rsvp Edge Function. */
  const r2 = await fetch(API + '/functions/v1/submit-rsvp', { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ guest_name: b.guest_name, phone: b.phone, email: b.email, attendance: b.attendance, party_size: b.party_size, event_ids: uuids, dietary_notes: b.dietary_notes, message: b.message, preferred_language: L, whatsapp_consent: b.whatsapp_consent, invite_code: inviteCode, ref_code: ref, website: '' }), signal: timeout(12000) });
  const j = await r2.json().catch(() => ({}));
  if (!r2.ok || !j.ok) throw new Error('fn ' + r2.status);
  return true;
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(form);
  if (f.get('website')) return;
  const b = {
    guest_name: String(f.get('guest_name') || '').trim(), phone: String(f.get('phone') || '').trim(), email: String(f.get('email') || '').trim(),
    attendance: f.get('attendance') || 'attending', party_size: Math.min(20, Math.max(1, Number(f.get('party_size')) || 1)),
    event_keys: f.getAll('ev').map(String), dietary_notes: String(f.get('dietary_notes') || '').trim(), message: String(f.get('message') || '').trim(),
    whatsapp_consent: f.get('whatsapp_consent') === 'yes'
  };
  if (b.attendance === 'not_attending') b.party_size = 1;
  const msg = $('msg'); msg.className = '';
  if (b.guest_name.length < 2) { msg.className = 'err'; msg.textContent = T('name_err'); form.guest_name.focus(); return }
  $('send').disabled = true; msg.textContent = T('saving');
  lastWa = waLink(waMessage(b));
  let saved = false;
  try { saved = await saveRsvp(b) } catch (err) { console.warn('RSVP save failed', err) }
  $('send').disabled = false; msg.textContent = '';
  $('wa-send').href = lastWa;
  $('t-thanks-p').textContent = T(saved ? 'thanks_p' : 'thanks_off');
  if (!saved) { msg.className = 'err'; msg.textContent = T('err') }
  form.hidden = true; $('done').classList.add('show'); $('done').focus();
});
$('again').addEventListener('click', () => { $('done').classList.remove('show'); form.hidden = false; form.guest_name.focus() });

/* ───────── Data ───────── */
const get = p => fetch(API + '/rest/v1/' + p, { headers: H, signal: timeout(10000) }).then(r => r.ok ? r.json() : null).catch(() => null);
const rpc = (fn, body) => fetch(API + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: timeout(8000) }).then(r => r.ok ? r.json() : null).catch(() => null);
const first = x => Array.isArray(x) ? x[0] : x;
(async () => {
  const [ev, st, gal, inv, secs] = await Promise.all([
    get('events?is_published=eq.true&order=sort_order,event_date'),
    get('site_settings?select=setting_key,value'),
    get('gallery_items?is_published=eq.true&order=sort_order'),
    inviteCode ? rpc('get_invite', { p_code: inviteCode }) : null,
    get('site_sections?is_published=eq.true&order=sort_order')
  ]);
  if (Array.isArray(ev) && ev.length) allEvents = ev;
  if (Array.isArray(secs)) sections = secs;
  if (Array.isArray(st)) for (const s of st) {
    if (s.setting_key === 'refs' && s.value && typeof s.value === 'object') { for (const k in s.value) refs[k] = { ...(refs[k] || {}), display_name: s.value[k].label, ...s.value[k] } }
    else settings[s.setting_key] = { ...(settings[s.setting_key] || {}), ...s.value };
  }
  const g = first(inv);
  if (g && g.full_name && !guestName) guestName = g.full_name;
  /* Which family member's link was used: ?ref= wins, then the guest's own link. */
  const code = askedRef || (g && g.ref_code) || '';
  const r = first(await rpc('get_referrer', { p_code: code || C.defaultRef }));
  if (r && r.code) refs[r.code] = r;
  ref = C.resolveRef(code, refs);
  filterEvents();
  if (Array.isArray(gal) && gal.length) {
    $('gallery-s').hidden = false;
    $('gallery').innerHTML = gal.map(i => `<figure><img loading="lazy" decoding="async" src="${esc(i.storage_path)}" alt="${esc(pick(i.alt_text) || pick(i.title))}"></figure>`).join('');
  }
  draw();
})();
filterEvents();
draw();
})();
</script>
