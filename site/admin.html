<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3b0918">
<title>Wedding dashboard · Sagar & Dhrupti</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--sindoor:#b3122e;--deep:#7d0a20;--haldi:#f2b705;--night:#3b0918;--paan:#1f6b4f;--bg:#fbf3f1;--card:#fff;--line:#eddcd8;--ink:#2a0610;--muted:#7a5a60;--ok:#1f8f4e;--r:12px;
  --dots:radial-gradient(circle,var(--haldi) 1.2px,transparent 1.7px)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-width:320px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25}
.display{font-family:'Rozha One',serif;font-weight:400}

/* login */
#login{min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:var(--dots) 0 0/16px 16px,var(--dots) 8px 8px/16px 16px,linear-gradient(160deg,var(--sindoor),var(--night))}
.login-card{width:min(400px,100%);background:#fffaf6;border-radius:22px;padding:2.2rem 1.8rem;text-align:center;box-shadow:0 0 0 2px var(--haldi),0 30px 80px #0007}
.seal{width:84px;height:84px;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe48a,var(--haldi) 50%,#c78e00);color:var(--deep);font:400 1.7rem/1 'Rozha One',serif;box-shadow:0 0 0 4px var(--deep)}
.login-card h1{font:400 1.9rem/1.2 'Rozha One',serif;color:var(--sindoor)}
.login-card p{color:var(--muted);margin:.5rem 0 1.6rem}
.gbtn{display:flex;align-items:center;justify-content:center;gap:.75rem;width:100%;min-height:50px;border:1px solid #dadce0;border-radius:999px;background:#fff;font-weight:600;cursor:pointer;transition:box-shadow .2s}
.gbtn:hover{box-shadow:0 2px 10px #0002}
.gbtn svg{width:20px;height:20px}
.login-err{color:var(--sindoor);font-weight:500;margin-top:1rem!important;min-height:1.2em}
.login-foot{font-size:.82rem;margin-top:1.4rem!important}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100svh}
aside{position:sticky;top:0;height:100svh;background:var(--night);color:#ffe2b8;display:flex;flex-direction:column;padding:1.2rem .8rem}
.brand{display:flex;align-items:center;gap:.7rem;padding:0 .5rem 1.2rem;border-bottom:1px solid #ffffff1a;margin-bottom:.8rem}
.brand .seal{width:40px;height:40px;margin:0;font-size:.9rem;box-shadow:0 0 0 2px var(--deep)}
.brand b{display:block;font:400 1.15rem/1.1 'Rozha One',serif;color:var(--haldi)}
.brand small{opacity:.7}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:.7rem;border:0;background:none;color:#ffe2b8;padding:.65rem .8rem;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
#nav button svg{width:18px;height:18px;flex:none;opacity:.85}
#nav button:hover{background:#ffffff10}
#nav button[aria-current=page]{background:var(--haldi);color:var(--night)}
.me{margin-top:auto;padding:.8rem .5rem 0;border-top:1px solid #ffffff1a;font-size:.85rem;display:grid;gap:.5rem}
.me .who{display:flex;align-items:center;gap:.6rem;min-width:0}
.me img{width:32px;height:32px;border-radius:50%;flex:none}
.me .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me em{font-style:normal;opacity:.65;font-size:.78rem;display:block}
main{padding:clamp(1rem,3vw,2rem);max-width:1180px;width:100%;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.head h1{font:400 clamp(1.6rem,4vw,2.1rem)/1.15 'Rozha One',serif;color:var(--night)}
.head p{margin:.2rem 0 0;color:var(--muted)}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem}
.card+.card{margin-top:1rem}
.card h2{font-size:1.05rem;margin-bottom:.2rem}
.card .sub{color:var(--muted);margin:0 0 1rem;font-size:.9rem}
.grid{display:grid;gap:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.stat b{display:block;font:400 2.1rem/1.1 'Rozha One',serif;color:var(--sindoor)}
.stat span{color:var(--muted);font-size:.88rem}
.stat.accent{background:var(--night);border-color:var(--night);color:#ffe2b8}
.stat.accent b{color:var(--haldi)}
.stat.accent span{color:#ffe2b8cc}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:40px;padding:.45rem .95rem;border:0;border-radius:10px;background:var(--sindoor);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn.sec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sec:hover{box-shadow:inset 0 0 0 1px #c9a9a3}
.btn.wa{background:var(--ok)}
.btn.danger{background:#fff;color:var(--sindoor);box-shadow:inset 0 0 0 1px #f0c2c9}
.btn.small{min-height:34px;padding:.3rem .7rem;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:progress}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.spacer{flex:1}
label.f{display:grid;gap:.3rem;font-size:.85rem;font-weight:600;color:#4b2a31}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;min-height:42px;padding:.5rem .7rem;border:1px solid #dcc6c1;border-radius:10px;background:#fff;font-weight:400}
textarea{min-height:90px;resize:vertical}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sindoor);box-shadow:0 0 0 3px #b3122e1f}
.check{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--sindoor)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.i18n{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.6rem;border:1px dashed var(--line);border-radius:12px;padding:.7rem;margin:0}
.i18n legend{font-size:.85rem;font-weight:700;padding:0 .3rem;display:flex;align-items:center}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.swatch{border:2px solid var(--line);border-radius:14px;padding:.6rem;background:#fff;cursor:pointer;text-align:left;display:grid;gap:.45rem}
.swatch[aria-pressed=true]{border-color:var(--sindoor);box-shadow:0 0 0 3px #b3122e22}
.swatch .bar{display:flex;height:34px;border-radius:9px;overflow:hidden}
.swatch .bar span{flex:1}
.swatch b{font-size:.95rem}.swatch small{color:var(--muted);font-size:.78rem;line-height:1.3}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;margin-top:.8rem}
.colors label{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:600}
.colors input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:600;background:#f3e7e4;color:#5a2330;white-space:nowrap}
.pill.attending{background:#dff3e7;color:#11603a}
.pill.not_attending{background:#fbe0e3;color:#8f0f26}
.pill.maybe{background:#fff2c7;color:#7a5600}
.pill.groom{background:#e7eefc;color:#1d3f8f}
.pill.bride{background:#fde4ef;color:#8f1d55}
.copybox{display:flex;align-items:center;gap:.5rem;min-width:0;background:#faf3f1;border:1px solid var(--line);border-radius:10px;padding:.4rem .4rem .4rem .7rem}
.copybox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}
.refcard{display:grid;gap:.7rem;padding:1rem;border:1px solid var(--line);border-radius:14px;background:linear-gradient(#fff,#fffaf8)}
.refcard header{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.refcard h3{font-size:1rem}
.refcard .num{color:var(--muted);font-size:.88rem}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}

/* list rows (cards on mobile, table-like on desktop) */
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.toolbar input,.toolbar select{width:auto;flex:1 1 180px}
.list{display:grid;gap:.6rem}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;display:grid;gap:.5rem}
.item .top{display:flex;gap:.6rem;align-items:flex-start;flex-wrap:wrap}
.item .top h3{font-size:1rem;flex:1;min-width:140px}
.item .meta{display:flex;flex-wrap:wrap;gap:.35rem .9rem;color:var(--muted);font-size:.86rem}
.item .msg{background:#faf3f1;border-radius:10px;padding:.5rem .7rem;font-size:.9rem;white-space:pre-wrap}
details.item>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.6rem;font-weight:600}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.item[open]>summary::after{transform:rotate(-135deg)}
details.item[open]{box-shadow:0 10px 30px -18px #7d0a2066}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem;border:1.5px dashed var(--line);border-radius:14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem}
.gal .item{padding:.6rem}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#f3e7e4}
.drop{border:2px dashed #dcb9b2;border-radius:14px;padding:1.4rem;text-align:center;background:#fffaf8;cursor:pointer}
.drop.over{border-color:var(--sindoor);background:#fdeceb}
.loading{color:var(--muted);padding:2rem 0}

#toast{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translate(-50%,150%);background:var(--night);color:#ffe2b8;padding:.7rem 1.1rem;border-radius:12px;box-shadow:0 10px 30px #0005;z-index:90;transition:transform .35s cubic-bezier(.22,1,.36,1);max-width:calc(100vw - 2rem)}
#toast:not(.show){visibility:hidden}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:var(--sindoor);color:#fff}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:.6rem .7rem;gap:.4rem}
  .brand{border:0;padding:0;margin:0;flex:1}
  .brand small{display:none}
  #nav{order:3;flex-direction:row;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  #nav::-webkit-scrollbar{display:none}
  #nav button{flex:none;padding:.5rem .75rem;font-size:.9rem}
  .me{margin:0;padding:0;border:0;display:flex;align-items:center}
  .me .who span,.me .who em{display:none}
  .me .btn{min-height:34px;padding:.3rem .7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="login" hidden>
  <div class="login-card">
    <div class="seal" aria-hidden="true">S&amp;D</div>
    <h1>Wedding dashboard</h1>
    <p>Family members, admins and the couple sign in here to share invitations and see RSVPs.</p>
    <button class="gbtn" id="google" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>Continue with Google</span>
    </button>
    <p class="login-err" id="login-err" role="alert"></p>
    <p class="login-foot">Only Google accounts added by the couple's admins can sign in.</p>
  </div>
</section>

<div class="shell" id="app" hidden>
  <aside>
    <div class="brand"><div class="seal" aria-hidden="true">S&amp;D</div><div><b>Sagar &amp; Dhrupti</b><small id="brand-sub">Wedding dashboard</small></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="me"><div class="who"><img id="me-img" alt="" hidden><span><span id="me-name"></span><em id="me-role"></em></span></div><button class="btn sec small" id="out" type="button">Sign out</button></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const C = window.WEDDING;
const S = supabase.createClient(C.supabaseUrl, C.supabaseKey, { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LG = ['en', 'gu', 'hi', 'mr'], LGN = { en: 'English', gu: 'Gujarati', hi: 'Hindi', mr: 'Marathi' };
const SITE = location.origin;
const MIGRATION = 'supabase/migrations/20261113000000_family_referrers_roles_sections.sql';
let me = null, user = null, member = null, tab = (location.hash.slice(1) || 'overview'), booted = false;
let settingsCache = {}, referrers = [], eventsCache = [];

const ROLE = { super_admin: 'Super admin', admin: 'Admin', user: 'Family member' };
const SIDE = { groom: "Groom's side", bride: "Bride's side", both: 'Both sides' };
const RELATIONS = [['groom', 'Groom'], ['bride', 'Bride'], ['father', 'Father'], ['mother', 'Mother'], ['brother', 'Brother'], ['sister', 'Sister'], ['grandparent', 'Grandparent'], ['uncle', 'Uncle (kaka / mama / fua / masa)'], ['aunt', 'Aunt (kaki / mami / foi / masi)'], ['cousin', 'Cousin'], ['friend', 'Friend'], ['other', 'Other']];
const relLabel = r => (RELATIONS.find(x => x[0] === r) || [r, r || ''])[1];
const isAdmin = () => me && (me.role === 'admin' || me.role === 'super_admin');
const isSuper = () => me && me.role === 'super_admin';

/* ───────── helpers ───────── */
let toastT;
function toast(text, bad) { const t = $('toast'); t.textContent = text; t.className = 'show' + (bad ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3200) }
async function audit(action, entity_type, entity_id, metadata) { if (!me) return; await S.from('audit_logs').insert({ actor_id: me.id, action, entity_type, entity_id: entity_id ? String(entity_id) : null, metadata: metadata || {} }) }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Link copied') } catch { prompt('Copy this link', text) } }
const digits = s => String(s || '').replace(/\D/g, '');
const phoneIntl = s => { let d = digits(s); if (d.length === 10) d = '91' + d; return d };
const waTo = (phone, text) => 'https://wa.me/' + phoneIntl(phone) + '?text=' + encodeURIComponent(text);
const waShare = text => 'https://wa.me/?text=' + encodeURIComponent(text);
const slug = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32);
const link = (code, extra) => { const u = new URL(SITE + '/'); u.searchParams.set('ref', code); for (const k in extra || {}) if (extra[k]) u.searchParams.set(k, extra[k]); return u.toString() };
const fmtDate = d => d ? new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Kolkata' }).format(new Date(d)) : '';
const refById = id => referrers.find(r => r.id === id);
const refOf = row => refById(row.referrer_id) || referrers.find(r => r.code === (row.ref_code || C.defaultRef)) || null;
const missing = err => err && /does not exist|schema cache|PGRST20[25]|42P01|42883/i.test((err.message || '') + (err.code || ''));
function migrationCard(title) { return head(title) + `<div class="card"><h2>One database step is pending</h2><p class="sub">Run <code>${MIGRATION}</code> once in the Supabase SQL editor, then reload this page.</p><button class="btn" onclick="location.reload()">Reload</button></div>` }
function inviteText(url, name, from) {
  const c = { ...C.couple, ...(settingsCache.couple || {}) }, v = { ...C.venue, ...(settingsCache.venue || {}) };
  const date = new Intl.DateTimeFormat('en-IN', { dateStyle: 'long', timeZone: 'Asia/Kolkata' }).format(new Date(c.wedding_date + 'T00:00:00+05:30'));
  return `🙏 ${name ? 'Dear ' + name + ',\n' : ''}With the blessings of our elders${from ? ', ' + from + ' warmly invites you' : ', you are warmly invited'} to the wedding of ${c.groom || 'Sagar'} & ${(c.bride || 'Dhrupti').split(' ')[0]}.\n\n📅 ${date}\n📍 ${v.name || ''}\n\nOpen your invitation and RSVP:\n${url}`;
}
function opts(list, value) { return list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(value ?? '') ? 'selected' : ''}>${esc(l)}</option>` }).join('') }
const I = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2s.2-1.1.1-1.2-.2-.2-.4-.3z"/></svg>',
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-5-5 5 5 5-5M4 21h16"/></svg>'
};
const NAV = [
  ['overview', 'Overview', '<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>', 'all'],
  ['links', 'Invite links', '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', 'all'],
  ['rsvps', 'RSVPs', '<path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>', 'all'],
  ['guests', 'Guests', '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11h6M20 8v6"/>', 'all'],

/* ───────── Auto-translate (Google Translate, MyMemory fallback) ───────── */
async function translate(text, to, from) {
  text = String(text || '').trim(); if (!text) return '';
  const sl = from || 'auto';
  try {
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`);
    const j = await r.json(); const t = (j[0] || []).map(x => x[0]).join('');
    if (t) return t;
  } catch {}
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?langpair=${sl === 'auto' ? 'en' : sl}|${to}&q=${encodeURIComponent(text)}`);
    const j = await r.json(); return j.responseData?.translatedText || '';
  } catch { return '' }
}
/* Every 4-language group gets a "Translate" button; leaving the English box fills empty languages. */
function wireTranslate(root) {
  root.querySelectorAll('fieldset.i18n').forEach(fs => {
    if (fs.dataset.tr) return; fs.dataset.tr = 1;
    const box = l => fs.querySelector(`[data-l="${l}"]`);
    if (!box('en')) return;
    const run = async (overwrite, btn) => {
      const src = ['en', 'gu', 'hi', 'mr'].find(l => box(l) && box(l).value.trim());
      if (!src) return toast('Type the text in any one language first', 1);
      const text = box(src).value;
      if (btn) { btn.disabled = true; btn.textContent = 'Translating…' }
      const targets = ['en', 'gu', 'hi', 'mr'].filter(l => l !== src && box(l) && (overwrite || !box(l).value.trim()));
      const res = await Promise.all(targets.map(l => translate(text, l, src)));
      let n = 0; targets.forEach((l, i) => { if (res[i]) { box(l).value = res[i]; box(l).dispatchEvent(new Event('input', { bubbles: true })); n++ } });
      if (btn) { btn.disabled = false; btn.textContent = '✨ Translate' }
      if (btn) toast(n ? `Translated into ${n} language${n > 1 ? 's' : ''}. Check names and edit if needed.` : 'Translation is not reachable right now. Type it manually.', !n);
    };
    const lg = fs.querySelector('legend');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sec small'; b.style.marginLeft = '.5rem'; b.textContent = '✨ Translate';
    b.title = 'Fill the other languages from the first filled box';
    b.onclick = () => run(true, b); lg.appendChild(b);
    box('en').addEventListener('change', () => run(false));
  });
}

  async links(m) {
    const [{ data: rs }, { data: mem }] = await Promise.all([S.from('rsvps').select('attendance,party_size,ref_code,referrer_id'), isAdmin() ? S.from('members').select('email,display_name,user_id,side') : Promise.resolve({ data: [] })]);
    if (referrers[0]?._fallback) { m.innerHTML = migrationCard('Invite links'); return }
    const st = statsByRef(rs || []);
    const mySide = member?.side || 'groom';
    const ownerOpts = [['', 'Nobody (managed by admins)'], ...(mem || []).map(x => [x.email, (x.display_name ? x.display_name + ' · ' : '') + x.email])];
    const form = (r) => `<div class="form-grid" style="margin-top:.6rem">
      <label class="f">Name guests will see<input data-f="display_name" value="${esc(r?.display_name ?? (r ? '' : (myRefs().length ? '' : member?.display_name || '')))}" placeholder="e.g. Sagar's Mummy" maxlength="80"><small class="sub" style="margin:0;font-weight:400">Shown as “Invited by …”</small></label>
      <label class="f">Link code<input data-f="code" value="${esc(r?.code)}" placeholder="e.g. groom-mother" maxlength="32" ${r && ['sags', 'drups'].includes(r.code) ? 'readonly' : ''}><small class="sub" style="margin:0;font-weight:400">Small letters, numbers, - only</small></label>
      <label class="f">Relation<select data-f="relation">${opts([['', '—'], ...RELATIONS], r?.relation ?? (r ? '' : member?.relation))}</select></label>
      ${isAdmin() ? `<label class="f">Side<select data-f="side">${opts([['groom', "Groom's side"], ['bride', "Bride's side"]], r?.side || mySide)}</select></label>` : `<label class="f">Side<input value="${esc(SIDE[mySide])}" readonly></label>`}
      <label class="f">WhatsApp for replies<input data-f="whatsapp" inputmode="tel" value="${esc(r?.whatsapp ?? (member?.whatsapp || ''))}" placeholder="919876543210"><small class="sub" style="margin:0;font-weight:400">With country code (91…)</small></label>
      ${isAdmin() ? `<label class="f">Belongs to (sees its RSVPs)<select data-f="owner_email">${opts(ownerOpts, r?.owner_email || '')}</select></label>` : ''}
      <label class="check"><input type="checkbox" data-f="is_active" ${r?.is_active === false ? '' : 'checked'}>Link active</label></div>`;
    const card = r => `<details class="item" data-id="${r.id}"><summary>${esc(r.display_name)}<span class="pill ${r.side}">${SIDE[r.side]}</span><span class="pill">?ref=${esc(r.code)}</span>${r.is_active === false ? '<span class="pill not_attending">Paused</span>' : ''}<span class="pill attending">${(st[r.id] || { heads: 0 }).heads} coming</span></summary>
      ${shareBox(r, st[r.id])}${isAdmin() ? `<p class="sub" style="margin:.2rem 0 0">Owner: ${esc(r.owner_email || (r.owner_user_id ? 'signed-in member' : 'admins'))}</p>` : ''}
      ${form(r)}<div class="row" style="margin-top:.8rem"><button class="btn" data-save type="button">Save changes</button>${['sags', 'drups'].includes(r.code) ? '' : '<button class="btn danger" data-rm type="button">Delete link</button>'}</div></details>`;
    const groups = isAdmin() ? ['groom', 'bride'].map(sd => [SIDE[sd], referrers.filter(r => r.side === sd)]) : [['Your links', referrers]];
    m.innerHTML = head('Invite links', isAdmin() ? 'One link per family member (or more). Each shows “Invited by …” and sends replies to that person’s WhatsApp.' : 'Make a link for each group you invite. Replies come to your WhatsApp and show up under RSVPs.') +
      `<details class="item" data-id="" ${referrers.length ? '' : 'open'}><summary>＋ New invite link</summary>${form(null)}<div class="row" style="margin-top:.8rem"><button class="btn" data-save type="button">Create link</button></div></details>` +
      groups.map(([title, list]) => `<h2 style="margin:1.4rem 0 .6rem;font-size:1rem">${title} <span class="sub">(${list.length})</span></h2><div class="list">${list.map(card).join('') || '<p class="empty">No links yet.</p>'}</div>`).join('');
    m.querySelectorAll('details.item').forEach(d => {
      const g = k => d.querySelector(`[data-f="${k}"]`);
      const nameEl = g('display_name'), codeEl = g('code');
      const autoCode = () => { if (!d.dataset.id && !codeEl.dataset.touched) codeEl.value = codeFor(isAdmin() ? g('side').value : mySide, g('relation').value) };
      codeEl.oninput = () => codeEl.dataset.touched = 1;
      g('relation').addEventListener('change', autoCode); if (isAdmin()) g('side').addEventListener('change', autoCode); autoCode();
      d.querySelector('[data-save]').onclick = async e => {
        const o = { display_name: nameEl.value.trim(), code: C.normalizeCode(codeEl.value) || codeFor(isAdmin() ? g('side').value : mySide, g('relation').value, d.dataset.id), relation: g('relation').value || null, whatsapp: phoneIntl(g('whatsapp').value), is_active: g('is_active').checked, side: isAdmin() ? g('side').value : mySide, updated_at: new Date().toISOString() };
        if (!o.display_name) return toast('Add the name guests will see', 1);
        if (o.code.length < 2) return toast('Link code needs at least 2 letters', 1);
        if (['groom', 'bride'].includes(o.code)) return toast('“groom” and “bride” are reserved for Sagar’s and Dhrupti’s own links. Try groom-mother, bride-brother…', 1);
        if (!/^[0-9]{11,15}$/.test(o.whatsapp)) return toast('Add a WhatsApp number with country code, e.g. 919876543210', 1);

        e.target.disabled = false;
        if (error) return toast(/duplicate|unique/i.test(error.message) ? `The code “${o.code}” is taken. Try another.` : error.message, 1);
        await audit(id ? 'update' : 'create', 'referrers', o.code); toast(id ? 'Saved' : 'Link created'); await loadContext(); show();
      };
      const rm = d.querySelector('[data-rm]');
      if (rm) rm.onclick = async () => { if (!confirm('Delete this link? RSVPs already received stay, but the link stops working.')) return; const { error } = await S.from('referrers').delete().eq('id', d.dataset.id); if (error) return toast(error.message, 1); await audit('delete', 'referrers', d.dataset.id); toast('Link deleted'); await loadContext(); show() };
    });
  },

  async rsvps(m) {
    const { data, error } = await S.from('rsvps').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    const evName = id => { const e = eventsCache.find(x => x.id === id); return e ? (e.title?.en || e.slug) : '' };
    const visRefs = referrers.filter(f => data.some(r => refOf(r) === f) || f.owner_user_id === user.id);
    m.innerHTML = head('RSVPs', isAdmin() ? `${data.length} replies from all links` : `${data.length} replies from your links`, `<button class="btn sec" id="csv">${I.dl}Download CSV</button>`) +
      `<div class="toolbar"><input type="search" id="q" placeholder="Search name, phone, message"><select id="fr"><option value="">Invited by anyone</option>${visRefs.map(f => `<option value="${esc(f.id || f.code)}">${esc(f.display_name)}</option>`).join('')}</select>${isAdmin() ? `<select id="fs"><option value="">Both sides</option><option value="groom">Groom's side</option><option value="bride">Bride's side</option></select>` : ''}<select id="fa"><option value="">Any answer</option><option value="attending">Coming</option><option value="maybe">Not sure</option><option value="not_attending">Can't come</option></select></div><p class="sub" id="sum"></p><div class="list" id="rl"></div>`;
    const draw = () => {
      const q = $('q').value.trim().toLowerCase(), fr = $('fr').value, fs = $('fs')?.value || '', fa = $('fa').value;
      const rows = data.filter(r => { const f = refOf(r); return (!fr || (f && (f.id || f.code) === fr)) && (!fs || (f?.side || 'groom') === fs) && (!fa || r.attendance === fa) && (!q || [r.guest_name, r.phone, r.email, r.message].join(' ').toLowerCase().includes(q)) });
      $('sum').textContent = `${rows.length} shown · ${rows.filter(r => r.attendance === 'attending').reduce((a, r) => a + r.party_size, 0)} guests coming`;
      $('rl').innerHTML = rows.length ? rows.map(r => { const f = refOf(r); return `<div class="item"><div class="top"><h3>${esc(r.guest_name)}</h3><span class="pill ${r.attendance}">${r.attendance.replace('_', ' ')}</span><span class="pill">${r.party_size} guest${r.party_size > 1 ? 's' : ''}</span>${f ? `<span class="pill ${f.side}">Invited by ${esc(f.display_name)}</span>` : ''}</div>
        <div class="meta">${r.phone ? `<span>📞 ${esc(r.phone)}</span>` : ''}${r.email ? `<span>✉️ ${esc(r.email)}</span>` : ''}<span>${fmtDate(r.created_at)}</span><span>${esc(LGN[r.preferred_language] || r.preferred_language)}</span>${(r.event_ids || []).length ? `<span>${esc(r.event_ids.map(evName).filter(Boolean).join(', '))}</span>` : ''}${r.dietary_notes ? `<span>🍽 ${esc(r.dietary_notes)}</span>` : ''}</div>
        ${r.message ? `<div class="msg">${esc(r.message)}</div>` : ''}
        <div class="row">${r.phone ? `<a class="btn wa small" target="_blank" rel="noopener" href="${esc(waTo(r.phone, `Namaste ${r.guest_name}! Thank you for your RSVP for Sagar & Dhrupti's wedding 🙏`))}">${I.wa}Reply on WhatsApp</a>` : ''}<span class="spacer"></span>${isAdmin() ? `<button class="btn danger small" data-del="${r.id}">Delete</button>` : ''}</div></div>` }).join('') : '<p class="empty">No replies match. Share your invite link to get started.</p>';
      $('rl').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Delete this RSVP?')) return; const { error } = await S.from('rsvps').delete().eq('id', b.dataset.del); if (error) return toast(error.message, 1); await audit('delete', 'rsvps', b.dataset.del); toast('Deleted'); show() });
    };
    ['q', 'fr', 'fs', 'fa'].forEach(id => { if ($(id)) $(id).oninput = draw }); draw();
    $('csv').onclick = () => {
      const h = ['guest_name', 'phone', 'email', 'attendance', 'party_size', 'invited_by', 'side', 'events', 'preferred_language', 'dietary_notes', 'message', 'created_at'];
      const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const val = (r, k) => { const f = refOf(r); return k === 'invited_by' ? f?.display_name : k === 'side' ? f?.side : k === 'events' ? (r.event_ids || []).map(evName).join('; ') : r[k] };
      const csv = '﻿' + [h.join(',')].concat(data.map(r => h.map(k => q(val(r, k))).join(','))).join('\n');
      Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `rsvps-${new Date().toISOString().slice(0, 10)}.csv` }).click();
    };
  },

  async guests(m) {

    const form = g => `<div class="form-grid" style="margin-top:.6rem"><label class="f">Full name<input data-k="full_name" value="${esc(g?.full_name)}"></label><label class="f">WhatsApp / phone<input data-k="phone" inputmode="tel" value="${esc(g?.phone)}" placeholder="98xxxxxxxx"></label><label class="f">Family / group<input data-k="household_label" value="${esc(g?.household_label)}"></label><label class="f">Invited by${refSel(g?.referrer_id)}</label><label class="f">Email<input data-k="email" type="email" value="${esc(g?.email)}"></label><label class="f">Invite code<input data-k="invite_code" value="${esc(g?.invite_code)}" placeholder="Created automatically"></label><label class="f" style="grid-column:1/-1">Notes<input data-k="notes" value="${esc(g?.notes)}"></label></div>`;

      `<div class="toolbar"><input type="search" id="q" placeholder="Search guests"></div>

      $('gl').innerHTML = rows.length ? rows.map(g => { const f = refById(g.referrer_id); return `<details class="item" data-id="${g.id}"><summary>${esc(g.full_name)} ${g.household_label ? `<span class="pill">${esc(g.household_label)}</span>` : ''}${f ? `<span class="pill ${f.side}">via ${esc(f.display_name)}</span>` : ''}</summary>
        <div class="copybox"><code>${esc(gl(g))}</code><button class="btn sec small" type="button" data-copy="${esc(gl(g))}">${I.copy}Copy</button></div>
        <div class="row"><a class="btn wa small" target="_blank" rel="noopener" href="${esc(g.phone ? waTo(g.phone, inviteText(gl(g), g.full_name, f?.display_name)) : waShare(inviteText(gl(g), g.full_name, f?.display_name)))}">${I.wa}${g.phone ? 'Send invite on WhatsApp' : 'Share on WhatsApp'}</a></div>
        ${form(g)}<div class="row" style="margin-top:.8rem"><button class="btn" data-save type="button">Save changes</button><button class="btn danger" data-rm type="button">Delete</button></div></details>` }).join('') : '<p class="empty">No guests yet. Add one above to create a personal invitation.</p>';

    $('q').oninput = draw; draw();

  async design(m) {

    const card = sd => {
      const conf = th[sd] || { preset: 'kankotri' }, t = C.themes[conf.preset] || C.themes.kankotri, cols = { ...t.colors, ...(conf.colors || {}) };
      return `<div class="card" data-side="${sd}"><div class="row"><h2>${SIDE[sd]}</h2><span class="spacer"></span><a class="btn sec small" target="_blank" rel="noopener" data-preview>${I.open}Preview</a>${sd === 'bride' ? '<button class="btn sec small" type="button" data-copyfrom>Same as groom</button>' : ''}</div>
        <p class="sub">Guests who open a ${sd} link (e.g. <code>?ref=${sd}</code>) see this design.</p>
        <div class="swatches">${Object.entries(C.themes).map(([k, v]) => `<button type="button" class="swatch" data-preset="${k}" aria-pressed="${k === conf.preset}"><div class="bar">${['dark', 'primary', 'accent', 'paper'].map(c => `<span style="background:${v.colors[c]}"></span>`).join('')}</div><b>${esc(v.name)}</b><small>${esc(v.note)}</small></button>`).join('')}</div>

        <details style="margin-top:.8rem"><summary style="cursor:pointer;font-weight:600">Fine-tune colours</summary><div class="colors">${COLS.map(([k, l]) => `<label><input type="color" data-col="${k}" value="${cols[k]}">${l}</label>`).join('')}</div><button class="btn sec small" type="button" data-reset style="margin-top:.6rem">Reset to preset colours</button></details></div>`;
    };

      const preset = box.querySelector('.swatch[aria-pressed=true]').dataset.preset, base = C.themes[preset].colors, colors = {};

    const refresh = box => { const conf = read(box); box.querySelector('[data-preview]').href = `${SITE}/?ref=${box.dataset.side}&skip&theme=${encodeURIComponent(JSON.stringify(conf))}` };
    m.querySelectorAll('.card[data-side]').forEach(box => {
      box.querySelectorAll('.swatch').forEach(b => b.onclick = () => {
        box.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x === b));
        const t = C.themes[b.dataset.preset]; box.querySelectorAll('[data-col]').forEach(i => i.value = t.colors[i.dataset.col]); box.querySelector('[data-font]').value = t.font; refresh(box);
      });
      box.querySelector('[data-reset]').onclick = () => { const t = C.themes[read(box).preset]; box.querySelectorAll('[data-col]').forEach(i => i.value = t.colors[i.dataset.col]); refresh(box) };
      box.querySelectorAll('[data-col],[data-font]').forEach(i => i.oninput = () => refresh(box));
      const cf = box.querySelector('[data-copyfrom]');
      if (cf) cf.onclick = () => { const g = read(m.querySelector('[data-side=groom]')); box.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x.dataset.preset === g.preset)); const cols = { ...C.themes[g.preset].colors, ...g.colors }; box.querySelectorAll('[data-col]').forEach(i => i.value = cols[i.dataset.col]); box.querySelector('[data-font]').value = g.font; refresh(box) };
      refresh(box);
    });
    $('save-theme').onclick = e => saveSetting('theme', { groom: read(m.querySelector('[data-side=groom]')), bride: read(m.querySelector('[data-side=bride]')) }, e.target);
  },

  async gallery(m) {
    const { data, error } = await S.from('gallery_items').select('*').order('sort_order');
    if (error) throw error;
    m.innerHTML = head('Gallery', 'Photos appear on the invitation when marked visible.') +
      `<label class="drop" id="drop"><input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden><b>Upload photos</b><br><span class="sub">Tap to choose or drop JPG, PNG or WebP files (max 10 MB each)</span></label>
      <div class="gal" style="margin-top:1rem">${data.map(g => `<div class="item" data-id="${g.id}"><img src="${esc(g.storage_path)}" alt="${esc(g.alt_text?.en || '')}" loading="lazy"><label class="f">Caption<input data-k="alt" value="${esc(g.alt_text?.en || '')}"></label><div class="row"><label class="check"><input type="checkbox" data-k="pub" ${g.is_published ? 'checked' : ''}>Visible</label><input data-k="ord" type="number" value="${g.sort_order}" style="width:70px;min-height:34px" aria-label="Order"></div><div class="row"><button class="btn small" data-save>Save</button><button class="btn sec small" data-copy="${esc(g.storage_path)}">Copy URL</button><button class="btn danger small" data-rm>Delete</button></div></div>`).join('')}</div>${data.length ? '' : '<p class="empty" style="margin-top:1rem">No photos yet.</p>'}`;
    const up = async files => {
      let n = 0;
      for (const f of files) {
        if (f.size > 10485760) { toast(f.name + ' is larger than 10 MB', 1); continue }
        const path = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${(f.name.split('.').pop() || 'jpg').toLowerCase()}`;
        toast(`Uploading ${f.name}…`);
        const { error } = await S.storage.from('wedding-gallery').upload(path, f, { contentType: f.type, upsert: false });
        if (error) { toast(error.message, 1); continue }
        const url = S.storage.from('wedding-gallery').getPublicUrl(path).data.publicUrl;
        const { error: e2 } = await S.from('gallery_items').insert({ storage_path: url, sort_order: data.length + n, is_published: true, alt_text: { en: '' }, title: {} });
        if (e2) { toast(e2.message, 1); continue } n++;
      }
      if (n) { await audit('upload', 'gallery_items', null, { count: n }); toast(`${n} photo${n > 1 ? 's' : ''} added`); show() }
    };
    $('file').onchange = e => up([...e.target.files]);
    const drop = $('drop'); drop.ondragover = e => { e.preventDefault(); drop.classList.add('over') }; drop.ondragleave = () => drop.classList.remove('over'); drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); up([...e.dataTransfer.files]) };
    m.querySelectorAll('.gal .item').forEach(d => {
      const k = s => d.querySelector(`[data-k="${s}"]`);
      d.querySelector('[data-save]').onclick = async () => { const { error } = await S.from('gallery_items').update({ alt_text: { en: k('alt').value.trim() }, is_published: k('pub').checked, sort_order: Number(k('ord').value) || 0 }).eq('id', d.dataset.id); if (error) return toast(error.message, 1); await audit('update', 'gallery_items', d.dataset.id); toast('Saved') };
      d.querySelector('[data-rm]').onclick = async () => {
        if (!confirm('Delete this photo?')) return;
        const g = data.find(x => x.id === d.dataset.id), marker = '/wedding-gallery/', i = g.storage_path.indexOf(marker);
        if (i > -1) await S.storage.from('wedding-gallery').remove([decodeURIComponent(g.storage_path.slice(i + marker.length))]);
        const { error } = await S.from('gallery_items').delete().eq('id', d.dataset.id); if (error) return toast(error.message, 1); await audit('delete', 'gallery_items', d.dataset.id); toast('Deleted'); show();
      };
    });
  },

  async settings(m) {
    const c = { ...C.couple, ...(settingsCache.couple || {}) }, v = { ...C.venue, ...(settingsCache.venue || {}) };
    m.innerHTML = head('Couple & venue', 'Changes appear on the invitation right away.') +
      `<div class="card"><h2>Couple</h2><p class="sub">Names in English. Gujarati, Hindi and Marathi spellings are built in.</p><div class="form-grid"><label class="f">Groom<input id="c-groom" value="${esc(c.groom)}"></label><label class="f">Bride<input id="c-bride" value="${esc(c.bride)}"></label><label class="f">Wedding date (countdown)<input id="c-date" type="date" value="${esc(c.wedding_date)}"></label><label class="f">Groom photo URL<input id="c-gp" value="${esc(c.groom_photo)}" placeholder="Upload in Gallery, then Copy URL"></label><label class="f">Bride photo URL<input id="c-bp" value="${esc(c.bride_photo)}"></label></div><div class="row" style="margin-top:.8rem"><span class="spacer"></span><button class="btn" id="save-couple" type="button">Save couple</button></div></div>
      <div class="card"><h2>Main venue</h2><p class="sub">Shown in the venue section and map. Each event can also have its own venue.</p><div class="form-grid"><label class="f">Venue name<input id="v-name" value="${esc(v.name)}"></label><label class="f">Google Maps link<input id="v-map" value="${esc(v.maps_url)}"></label><label class="f" style="grid-column:1/-1">Address<textarea id="v-addr" style="min-height:70px">${esc(v.address)}</textarea></label></div><div class="row" style="margin-top:.8rem"><span class="spacer"></span><button class="btn" id="save-venue" type="button">Save venue</button></div></div>`;
    $('save-couple').onclick = e => saveSetting('couple', { ...(settingsCache.couple || {}), groom: $('c-groom').value.trim(), bride: $('c-bride').value.trim(), wedding_date: $('c-date').value, groom_photo: $('c-gp').value.trim() || undefined, bride_photo: $('c-bp').value.trim() || undefined }, e.target);
    $('save-venue').onclick = e => saveSetting('venue', { ...(settingsCache.venue || {}), name: $('v-name').value.trim(), address: $('v-addr').value.trim(), maps_url: $('v-map').value.trim() }, e.target);
  },

  async people(m) {
    const { data, error } = await S.from('members').select('*').order('role').order('created_at');
    if (error) throw error;
    const roles = isSuper() ? [['user', 'Family member: own links & RSVPs'], ['admin', 'Admin: edit the whole site'], ['super_admin', 'Super admin: also manage admins']] : [['user', 'Family member: own links & RSVPs']];
    const canEdit = x => isSuper() || x.role === 'user';
    const form = x => `<div class="form-grid" style="margin-top:.6rem">
      <label class="f">Google email<input data-p="email" type="email" value="${esc(x?.email)}" ${x ? 'readonly' : ''} placeholder="name@gmail.com"></label>
      <label class="f">Name<input data-p="display_name" value="${esc(x?.display_name)}" placeholder="e.g. Sagar's Mummy"></label>
      <label class="f">Access<select data-p="role">${opts(roles, x?.role || 'user')}</select></label>
      <label class="f">Side<select data-p="side">${opts([['', 'Let them choose at first sign-in'], ['groom', "Groom's side"], ['bride', "Bride's side"]], x ? (x.side || '') : '')}</select></label>
      <label class="f">Relation<select data-p="relation">${opts([['', '—'], ...RELATIONS], x?.relation || '')}</select></label>
      <label class="f">WhatsApp<input data-p="whatsapp" inputmode="tel" value="${esc(x?.whatsapp)}" placeholder="919876543210"></label>
      ${x ? '' : `<label class="check" style="grid-column:1/-1"><input type="checkbox" data-p="mklink" checked>Also create their invite link now (needs side + WhatsApp; otherwise it's made when they sign in)</label>`}</div>`;
    m.innerHTML = head('People & access', isSuper() ? 'Add family members, admins and super admins by Google email.' : 'Add family members by Google email. They can sign in, make invite links and see their RSVPs.') +
      `<details class="item" data-email="" open><summary>＋ Add person</summary>${form(null)}<div class="row" style="margin-top:.8rem"><button class="btn" data-save type="button">Give access</button></div></details>
      <div class="list" style="margin-top:1rem">${data.map(x => `<details class="item" data-email="${esc(x.email)}"><summary>${esc(x.display_name || x.email)}<span class="pill ${x.role === 'user' ? '' : 'bride'}">${ROLE[x.role]}</span>${x.side ? `<span class="pill ${x.side}">${SIDE[x.side]}</span>` : '<span class="pill maybe">Side not chosen</span>'}${x.relation ? `<span class="pill">${esc(relLabel(x.relation))}</span>` : ''}<span class="pill ${x.user_id ? 'attending' : 'maybe'}">${x.user_id ? 'Signed in' : 'Not signed in yet'}</span></summary>
        <div class="meta">${esc(x.email)} · invite links: ${referrers.filter(f => f.owner_email === x.email || (x.user_id && f.owner_user_id === x.user_id)).map(f => esc(f.code)).join(', ') || 'none'}</div>
        ${canEdit(x) && x.email !== (user.email || '').toLowerCase() ? form(x) + `<div class="row" style="margin-top:.8rem"><button class="btn" data-save type="button">Save</button><button class="btn danger" data-rm type="button">Remove access</button></div>` : `<p class="sub">${x.email === (user.email || '').toLowerCase() ? 'This is you. Edit your details under My profile.' : 'Only a super admin can change this person.'}</p>`}</details>`).join('')}</div>`;
    m.querySelectorAll('details.item[data-email]').forEach(d => {
      const g = k => d.querySelector(`[data-p="${k}"]`);
      const save = d.querySelector('[data-save]'); if (!save) return;
      save.onclick = async e => {
        const editing = d.dataset.email;
        const o = { email: (editing || g('email').value).trim().toLowerCase(), display_name: g('display_name').value.trim() || null, role: g('role').value, side: g('side').value || null, relation: g('relation').value || null, whatsapp: digits(g('whatsapp').value) ? phoneIntl(g('whatsapp').value) : null };
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email)) return toast('Enter a valid Google email', 1);
        if (o.whatsapp && !/^[0-9]{11,15}$/.test(o.whatsapp)) return toast('WhatsApp needs the country code, e.g. 919876543210', 1);
        e.target.disabled = true;
        const { error } = editing ? await S.from('members').update(o).eq('email', editing) : await S.from('members').insert({ ...o, created_by: me.id });
        if (error) { e.target.disabled = false; return toast(/duplicate|unique/i.test(error.message) ? 'This email already has access.' : error.message, 1) }
        if (!editing && g('mklink')?.checked && o.side && o.whatsapp) {
          {
            const code = codeFor(o.side, o.relation);
            const { error: e2 } = await S.from('referrers').insert({ code, display_name: o.display_name || o.email.split('@')[0], relation: o.relation, side: o.side, whatsapp: o.whatsapp, owner_email: o.email, created_by: me.id });
            if (e2) toast('Access given, but the link failed: ' + e2.message, 1);
          }
        }
        e.target.disabled = false;
        await audit(editing ? 'update' : 'grant', 'members', o.email, { role: o.role }); toast(editing ? 'Saved' : `${o.email} can sign in now`); await loadContext(); show();
      };
      const rm = d.querySelector('[data-rm]');
      if (rm) rm.onclick = async () => { if (!confirm(`Remove access for ${d.dataset.email}? Their invite links keep working.`)) return; const { error } = await S.from('members').delete().eq('email', d.dataset.email); if (error) return toast(error.message, 1); await audit('revoke', 'members', d.dataset.email); toast('Access removed'); show() };
    });
  },

  async profile(m) {
    const mine = myRefs();
    m.innerHTML = head('My profile', 'How you appear to guests you invite.') +
      `<div class="card"><div class="form-grid"><label class="f">Your name<input id="p-name" value="${esc(member?.display_name || me.display_name || '')}"></label><label class="f">WhatsApp (with country code)<input id="p-wa" inputmode="tel" value="${esc(member?.whatsapp || '')}" placeholder="919876543210"></label><label class="f">Access<input value="${esc(ROLE[me.role])}" readonly></label><label class="f">Side<input value="${esc(member?.side ? SIDE[member.side] : 'Not set')}" readonly></label><label class="f">Relation<input value="${esc(relLabel(member?.relation) || 'Not set')}" readonly></label><label class="f">Google account<input value="${esc(user.email)}" readonly></label></div>
      ${mine.length ? `<label class="check" style="margin-top:.8rem"><input type="checkbox" id="p-apply" checked>Use this WhatsApp number on my ${mine.length} invite link${mine.length > 1 ? 's' : ''}</label>` : ''}
      <div class="row" style="margin-top:.8rem"><span class="spacer"></span><button class="btn" id="p-save" type="button">Save profile</button></div></div>`;
    $('p-save').onclick = async e => {
      const wa = digits($('p-wa').value) ? phoneIntl($('p-wa').value) : '';
      if (wa && !/^[0-9]{11,15}$/.test(wa)) return toast('WhatsApp needs the country code, e.g. 919876543210', 1);
      e.target.disabled = true;
      const { error } = await S.rpc('update_my_member', { p_display_name: $('p-name').value, p_whatsapp: wa });
      if (!error && wa && $('p-apply')?.checked) await S.from('referrers').update({ whatsapp: wa }).eq('owner_user_id', user.id);
      e.target.disabled = false; if (error) return toast(missing(error) ? 'Run the latest database migration first.' : error.message, 1);
      toast('Saved'); await loadContext(); $('me-name').textContent = member?.display_name || user.email; show();
    };
  }
};
})();
</script>
</body></html>
